# =============================================================================
# Destroy Workflow — Plan (default) or Plan + Destroy (checkbox + confirm)
# =============================================================================

name: Destroy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Execute destroy? (run without first to review plan)"
        type: boolean
        default: false
      confirm:
        description: 'Type "destroy" to confirm (required when apply=true)'
        type: string
        default: ""
      environment:
        description: "Environment to destroy"
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  # Per environment (deploy + destroy share it); PR plans queue separately so
  # they never replace a pending manual run.
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
  TF_VAR_environment: ${{ inputs.environment || 'dev' }}

jobs:
  destroy:
    name: Destroy
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      # Environment-scoped secrets/vars resolve only in jobs that reference the environment.
      TF_VAR_otc_access_key: ${{ secrets.OTC_ACCESS_KEY }}
      TF_VAR_otc_secret_key: ${{ secrets.OTC_SECRET_KEY }}
      TF_VAR_otc_domain_name: ${{ secrets.OTC_DOMAIN_NAME }}
      TF_VAR_otc_project_name: ${{ vars.OTC_PROJECT_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
    steps:
      - name: Confirm check
        if: inputs.apply && inputs.confirm != 'destroy'
        run: |
          echo "You must type 'destroy' in the confirm field to execute." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v7

      - name: Check configuration
        run: |
          if [ -z "$TF_VAR_otc_project_name" ]; then
            echo "::error::Variable OTC_PROJECT_NAME is not set for environment '$DEPLOY_ENV' (Settings → Environments → $DEPLOY_ENV → Environment variables)."
            exit 1
          fi
          # Environment files marked as template are not deployable yet.
          if grep -q '^# STATUS: template' infra/envs/"$DEPLOY_ENV".tfvars workloads/envs/"$DEPLOY_ENV".tfvars; then
            echo "::error::Environment '$DEPLOY_ENV' is not configured yet (infra/envs and workloads/envs contain '# STATUS: template')."
            exit 1
          fi

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.13"
          tofu_wrapper: false

      - name: OpenTofu Init (Workloads)
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: bash ../scripts/init-stack.sh workloads

      - name: OpenTofu Destroy Plan (Workloads)
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: tofu plan -destroy -var-file="envs/${DEPLOY_ENV}.tfvars" -input=false -no-color

      - name: OpenTofu Destroy (Workloads)
        if: inputs.apply
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: tofu destroy -var-file="envs/${DEPLOY_ENV}.tfvars" -auto-approve -input=false

      - name: OpenTofu Init (Infra)
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: bash ../scripts/init-stack.sh infra

      - name: OpenTofu Destroy Plan (Infra)
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          set -o pipefail
          tofu plan -destroy -var-file="envs/${DEPLOY_ENV}.tfvars" -input=false -no-color 2>&1 | tee plan-output.txt

          {
            echo "## Destroy Plan "
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review reminder
        if: ${{ !inputs.apply }}
        run: echo "**Plan only** — re-run with apply checked and confirm='destroy' to execute." >> "$GITHUB_STEP_SUMMARY"

      - name: OpenTofu Destroy (Infra)
        if: inputs.apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          # SWR refuses to delete organizations with repositories: empty it first.
          SWR_ORG=$(tofu output -raw swr_organization 2>/dev/null || true)
          python3 ../scripts/destroy-cleanup.py --swr-org "$SWR_ORG"
          tofu plan -destroy -var-file="envs/${DEPLOY_ENV}.tfvars" -out=destroy-final.tfplan -input=false
          tofu apply -input=false destroy-final.tfplan

      - name: Summary
        if: inputs.apply
        run: echo "## All Resources Destroyed " >> "$GITHUB_STEP_SUMMARY"
