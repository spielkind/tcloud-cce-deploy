name: Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes? (run without first to review plan)"
        type: boolean
        default: false
      build_images:
        description: "Build and push container images"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths: ["infra/**", "apps/**"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  TF_VAR_otc_access_key: ${{ secrets.OTC_ACCESS_KEY }}
  TF_VAR_otc_secret_key: ${{ secrets.OTC_SECRET_KEY }}
  TF_VAR_otc_domain_name: ${{ secrets.OTC_DOMAIN_NAME }}
  TF_VAR_otc_project_name: ${{ vars.OTC_PROJECT_NAME }}
  AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}

jobs:
  infra:
    name: Infra
    runs-on: ubuntu-latest
    outputs:
      swr_org: ${{ steps.infra_outputs.outputs.swr_org }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$TF_VAR_otc_project_name" ]; then
            echo "::error::Repository variable OTC_PROJECT_NAME is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.13"
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init -input=false

      - name: OpenTofu Format Check
        working-directory: infra
        run: tofu fmt -check -recursive -diff

      - name: OpenTofu Validate
        working-directory: infra
        run: tofu validate

      - name: OpenTofu Plan
        working-directory: infra
        run: |
          set -o pipefail
          tofu plan -input=false -no-color 2>&1 | tee plan-output.txt

      - name: Plan Summary
        if: ${{ always() && hashFiles('infra/plan-output.txt') != '' }}
        working-directory: infra
        run: |
          {
            echo "## Infra Plan"
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OpenTofu Apply
        if: inputs.apply
        working-directory: infra
        run: tofu apply -auto-approve -input=false

      - name: Export outputs
        id: infra_outputs
        if: inputs.apply
        working-directory: infra
        run: echo "swr_org=$(tofu output -raw swr_organization)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: inputs.apply
        working-directory: infra
        run: |
          {
            echo "## Infra Deployed"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Cluster | $(tofu output -raw cce_cluster_name) |"
            echo "| API Endpoint | $(tofu output -raw cce_api_endpoint) |"
            echo "| VPC | $(tofu output -raw vpc_id) |"
            echo "| Ingress ELB | $(tofu output -raw ingress_elb_public_ip 2>/dev/null || echo 'n/a') |"
            echo "| SWR Org | $(tofu output -raw swr_organization 2>/dev/null || echo 'n/a') |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: Build Images
    needs: infra
    if: inputs.apply && inputs.build_images
    runs-on: ubuntu-latest
    env:
      SWR_ENDPOINT: swr.eu-de.otc.t-systems.com
    steps:
      - uses: actions/checkout@v7

      - name: Login to SWR
        run: |
          LOGIN_KEY=$(printf "${{ secrets.OTC_ACCESS_KEY }}" | openssl dgst -binary -sha256 -hmac "${{ secrets.OTC_SECRET_KEY }}" | od -An -vtx1 | sed 's/[ \n]//g' | sed 'N;s/\n//')
          echo "$LOGIN_KEY" | docker login ${{ env.SWR_ENDPOINT }} \
            -u "${{ vars.OTC_PROJECT_NAME }}@${{ secrets.OTC_ACCESS_KEY }}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build + push demo-app
        uses: docker/build-push-action@v7
        with:
          context: apps/demo-app
          push: true
          tags: |
            ${{ env.SWR_ENDPOINT }}/${{ needs.infra.outputs.swr_org }}/demo-app:${{ github.sha }}
            ${{ env.SWR_ENDPOINT }}/${{ needs.infra.outputs.swr_org }}/demo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ github.sha }}
          provenance: false

  apps:
    name: Apps
    needs: [infra, build-images]
    if: |
      !cancelled() &&
      inputs.apply &&
      needs.infra.result == 'success' &&
      (needs.build-images.result == 'success' ||
       (needs.build-images.result == 'skipped' && !inputs.build_images))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.13"
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: apps
        run: tofu init -input=false

      - name: Select demo app image tag
        working-directory: apps
        env:
          BUILT: ${{ needs.build-images.result == 'success' }}
        run: |
          # New build → its commit SHA; otherwise keep the currently deployed tag.
          if [ "$BUILT" = "true" ]; then
            TAG="$GITHUB_SHA"
          else
            TAG=$(tofu output -raw demo_app_image_tag 2>/dev/null || true)
          fi
          echo "TF_VAR_demo_app_image_tag=${TAG:-latest}" >> "$GITHUB_ENV"

      - name: OpenTofu Plan
        working-directory: apps
        run: |
          set -o pipefail
          tofu plan -input=false -no-color 2>&1 | tee plan-output.txt

      - name: Plan Summary
        if: ${{ always() && hashFiles('apps/plan-output.txt') != '' }}
        working-directory: apps
        run: |
          {
            echo "## Apps Plan"
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: OpenTofu Apply
        working-directory: apps
        run: tofu apply -auto-approve -input=false

      - name: Summary
        working-directory: apps
        run: |
          {
            echo "## Apps Deployed"
            echo ""
            echo "| App | URL |"
            echo "|---|---|"
            echo "| podinfo | $(tofu output -raw app_url 2>/dev/null || echo 'n/a') |"
            echo "| openbao | $(tofu output -raw openbao_url 2>/dev/null || echo 'n/a') |"
            echo "| demo-app | $(tofu output -raw demo_app_url 2>/dev/null || echo 'n/a') |"
          } >> "$GITHUB_STEP_SUMMARY"
