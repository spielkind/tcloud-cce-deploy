name: Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes? (run without first to review plan)"
        type: boolean
        default: false
      build_images:
        description: "Build and push container images"
        type: boolean
        default: false
      environment:
        description: "Environment to plan/deploy"
        type: choice
        options: [dev, prod]
        default: dev
  pull_request:
    branches: [main]
    paths: ["infra/**", "workloads/**"]

concurrency:
  # Per environment (deploy + destroy share it); PR plans queue separately so
  # they never replace a pending manual run.
  group: ${{ github.event_name == 'pull_request' && format('plan-{0}', github.ref) || format('deploy-{0}', inputs.environment || 'dev') }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
  TF_VAR_environment: ${{ inputs.environment || 'dev' }}

jobs:
  infra:
    name: Infra
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      # Environment-scoped secrets/vars resolve only in jobs that reference the environment.
      TF_VAR_otc_access_key: ${{ secrets.OTC_ACCESS_KEY }}
      TF_VAR_otc_secret_key: ${{ secrets.OTC_SECRET_KEY }}
      TF_VAR_otc_domain_name: ${{ secrets.OTC_DOMAIN_NAME }}
      TF_VAR_otc_project_name: ${{ vars.OTC_PROJECT_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
    outputs:
      swr_org: ${{ steps.infra_outputs.outputs.swr_org }}
      swr_endpoint: ${{ steps.infra_outputs.outputs.swr_endpoint }}
      gpu_enabled: ${{ steps.infra_outputs.outputs.gpu_enabled }}
      cluster_running: ${{ steps.power.outputs.running }}
    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        run: |
          if [ -z "$TF_VAR_otc_project_name" ]; then
            echo "::error::Variable OTC_PROJECT_NAME is not set for environment '$DEPLOY_ENV' (Settings → Environments → $DEPLOY_ENV → Environment variables)."
            exit 1
          fi
          # Environment files marked as template are not deployable yet.
          if grep -q '^# STATUS: template' infra/envs/"$DEPLOY_ENV".tfvars workloads/envs/"$DEPLOY_ENV".tfvars; then
            echo "::error::Environment '$DEPLOY_ENV' is not configured yet (infra/envs and workloads/envs contain '# STATUS: template')."
            exit 1
          fi

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.13"
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: infra
        run: bash ../scripts/init-stack.sh infra

      # A hibernated cluster (Power workflow) cannot be planned/applied against.
      - name: Check power state
        id: power
        working-directory: infra
        run: |
          CLUSTER_ID=$(tofu output -raw cce_cluster_id 2>/dev/null || true)
          rc=0
          if [ -n "$CLUSTER_ID" ]; then
            python3 ../scripts/env-power.py check --cluster-id "$CLUSTER_ID" || rc=$?
          fi
          case $rc in
            0) echo "running=true" >> "$GITHUB_OUTPUT" ;;
            3)
              if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                echo "::warning::Environment '$DEPLOY_ENV' is powered off; the workloads plan is skipped."
                echo "running=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Environment '$DEPLOY_ENV' is powered off. Run Actions → Power → start first."
                exit 1
              fi
              ;;
            *) exit "$rc" ;;
          esac

      - name: OpenTofu Format Check
        working-directory: infra
        run: tofu fmt -check -recursive -diff

      - name: OpenTofu Validate
        working-directory: infra
        run: tofu validate

      - name: OpenTofu Plan
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          set -o pipefail
          tofu plan -var-file="envs/${DEPLOY_ENV}.tfvars" -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: Plan Summary
        if: ${{ always() && hashFiles('infra/plan-output.txt') != '' }}
        working-directory: infra
        run: |
          {
            echo "## Infra Plan"
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Apply exactly the plan shown above (no re-plan between review and apply).
      - name: OpenTofu Apply
        if: inputs.apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: tofu apply -input=false tfplan

      - name: Export outputs
        id: infra_outputs
        if: inputs.apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          {
            echo "swr_org=$(tofu output -raw swr_organization)"
            echo "swr_endpoint=$(tofu output -raw swr_endpoint)"
            echo "gpu_enabled=$(tofu output -raw gpu_node_pool_enabled 2>/dev/null || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        if: inputs.apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          {
            echo "## Infra Deployed"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Cluster | $(tofu output -raw cce_cluster_name) |"
            echo "| API Endpoint | $(tofu output -raw cce_api_endpoint) |"
            echo "| VPC | $(tofu output -raw vpc_id) |"
            echo "| Ingress ELB | $(tofu output -raw ingress_elb_public_ip 2>/dev/null || echo 'n/a') |"
            echo "| SWR Org | $(tofu output -raw swr_organization 2>/dev/null || echo 'n/a') |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: Build Images
    needs: infra
    if: inputs.apply && inputs.build_images
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_otc_access_key: ${{ secrets.OTC_ACCESS_KEY }}
      TF_VAR_otc_secret_key: ${{ secrets.OTC_SECRET_KEY }}
      TF_VAR_otc_domain_name: ${{ secrets.OTC_DOMAIN_NAME }}
      TF_VAR_otc_project_name: ${{ vars.OTC_PROJECT_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
      SWR_ENDPOINT: ${{ needs.infra.outputs.swr_endpoint }}
    steps:
      - uses: actions/checkout@v7

      - name: Login to SWR
        env:
          AK: ${{ secrets.OTC_ACCESS_KEY }}
          SK: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          LOGIN_KEY=$(printf '%s' "$AK" | openssl dgst -binary -sha256 -hmac "$SK" | od -An -vtx1 | tr -d ' \n')
          echo "$LOGIN_KEY" | docker login "$SWR_ENDPOINT" -u "${TF_VAR_otc_project_name}@${AK}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build + push demo-app
        uses: docker/build-push-action@v7
        with:
          context: workloads/demo-app
          push: true
          tags: |
            ${{ env.SWR_ENDPOINT }}/${{ needs.infra.outputs.swr_org }}/demo-app:${{ github.sha }}
            ${{ env.SWR_ENDPOINT }}/${{ needs.infra.outputs.swr_org }}/demo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ github.sha }}
          provenance: false

      # The CUDA base image needs more disk than a default runner has free.
      - name: Free disk space
        if: needs.infra.outputs.gpu_enabled == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Build + push gpu-demo
        if: needs.infra.outputs.gpu_enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: workloads/gpu-demo
          push: true
          tags: |
            ${{ env.SWR_ENDPOINT }}/${{ needs.infra.outputs.swr_org }}/gpu-demo:${{ github.sha }}
            ${{ env.SWR_ENDPOINT }}/${{ needs.infra.outputs.swr_org }}/gpu-demo:latest
          build-args: APP_VERSION=${{ github.sha }}
          provenance: false

  workloads:
    name: Workloads
    needs: [infra, build-images]
    if: |
      !cancelled() &&
      needs.infra.result == 'success' &&
      needs.infra.outputs.cluster_running != 'false' &&
      (!inputs.apply ||
       needs.build-images.result == 'success' ||
       (needs.build-images.result == 'skipped' && !inputs.build_images))
    environment: ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    env:
      # Environment-scoped secrets/vars resolve only in jobs that reference the environment.
      TF_VAR_otc_access_key: ${{ secrets.OTC_ACCESS_KEY }}
      TF_VAR_otc_secret_key: ${{ secrets.OTC_SECRET_KEY }}
      TF_VAR_otc_domain_name: ${{ secrets.OTC_DOMAIN_NAME }}
      TF_VAR_otc_project_name: ${{ vars.OTC_PROJECT_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.13"
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: bash ../scripts/init-stack.sh workloads

      - name: Select image tags
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
          TF_VAR_demo_app_image_tag: latest
          TF_VAR_gpu_demo_image_tag: latest
          BUILT: ${{ needs.build-images.result == 'success' }}
          GPU_BUILT: ${{ needs.build-images.result == 'success' && needs.infra.outputs.gpu_enabled == 'true' }}
        run: |
          # New build → its commit SHA; otherwise keep the currently deployed tag.
          set -euo pipefail
          # Filter immediately; other state outputs can contain credentials.
          TAGS=$(tofu output -json | jq -ce 'with_entries(select(.key == "demo_app_image_tag" or .key == "gpu_demo_image_tag"))')
          tag() {
            if [ "$1" = true ]; then printf '%s\n' "$GITHUB_SHA"; else
              jq -er --arg key "$2" '
                (if has($key) then .[$key].value else "latest" end) |
                select(type == "string" and test("\\A[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}\\z"))
              ' <<< "$TAGS"
            fi
          }
          DEMO=$(tag "$BUILT" demo_app_image_tag)
          GPU=$(tag "$GPU_BUILT" gpu_demo_image_tag)
          {
            echo "TF_VAR_demo_app_image_tag=$DEMO"
            echo "TF_VAR_gpu_demo_image_tag=$GPU"
          } >> "$GITHUB_ENV"

      - name: OpenTofu Plan
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: |
          set -o pipefail
          tofu plan -var-file="envs/${DEPLOY_ENV}.tfvars" -input=false -no-color -out=tfplan 2>&1 | tee plan-output.txt

      - name: OpenTofu Apply
        if: inputs.apply
        working-directory: workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTC_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_SECRET_KEY }}
        run: tofu apply -input=false tfplan

      - name: Plan Summary
        if: ${{ always() && hashFiles('workloads/plan-output.txt') != '' }}
        working-directory: workloads
        run: |
          {
            echo "## Workloads Plan"
            echo '```'
            cat plan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: inputs.apply
        working-directory: workloads
        run: |
          {
            echo "## Workloads Deployed"
            echo ""
            echo "| App | URL |"
            echo "|---|---|"
            echo "| podinfo | $(tofu output -raw app_url 2>/dev/null || echo 'n/a') |"
            echo "| openbao | $(tofu output -raw openbao_url 2>/dev/null || echo 'n/a') |"
            echo "| demo-app | $(tofu output -raw demo_app_url 2>/dev/null || echo 'n/a') |"
            echo "| gpu-demo | $(tofu output -raw gpu_demo_url 2>/dev/null || echo 'n/a') |"
          } >> "$GITHUB_STEP_SUMMARY"
