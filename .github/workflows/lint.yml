name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opentofu:
    name: OpenTofu (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, infra, workloads]
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.13"
          tofu_wrapper: false

      - name: Format
        run: tofu fmt -check -recursive -diff ${{ matrix.dir }}

      - name: Validate
        working-directory: ${{ matrix.dir }}
        run: |
          tofu init -backend=false -input=false
          tofu validate

  charts:
    name: Helm charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: |
          helm lint workloads/charts/cluster-issuer
          helm lint workloads/charts/demo-app --set image=example,hostname=example.org,accessMode=both
          helm lint workloads/charts/demo-app --set image=example,hostname=example.org,accessMode=api
          helm lint workloads/charts/demo-app --set image=example,hostname=example.org,accessMode=agent
          helm lint workloads/charts/gpu-demo --set image=example,hostname=example.org
          helm lint workloads/charts/gpu-demo --set image=example,hostname=example.org,slicing.enabled=true

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck scripts/*.sh infra/modules/openbao/files/*.sh

      - name: Ruff
        run: pipx run ruff==0.17.6 check --isolated --select E,F,W --line-length 140 scripts workloads/demo-app workloads/gpu-demo infra/modules/openbao-unseal/function infra/modules/openbao/files

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
