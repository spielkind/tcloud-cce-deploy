<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6fa5"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f39c12"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2ecc71"/></marker>
  </defs>

  <rect width="860" height="540" fill="url(#bg)" rx="12"/>
  <text x="430" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">GPU Slicing with CCE xGPU</text>
  <text x="430" y="53" text-anchor="middle" fill="#889" font-size="10">gpu_xgpu = true · Volcano places all pods on one L4 · hard VRAM and compute limit per pod</text>

  <!-- Browser -->
  <rect x="40" y="80" width="170" height="46" rx="8" fill="url(#card)" stroke="#4a6fa5"/>
  <text x="125" y="101" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">Browser</text>
  <text x="125" y="116" text-anchor="middle" fill="#889" font-size="9">tab "GPU Slicing" (via ingress)</text>

  <!-- Volcano -->
  <rect x="320" y="80" width="220" height="46" rx="8" fill="url(#card)" stroke="#f39c12"/>
  <text x="430" y="101" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="600">Volcano scheduler addon</text>
  <text x="430" y="116" text-anchor="middle" fill="#889" font-size="9">schedulerName: volcano · plugins xgpu, binpack</text>

  <!-- GPU addon -->
  <rect x="630" y="80" width="190" height="46" rx="8" fill="url(#card)" stroke="#2ecc71"/>
  <text x="725" y="101" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="600">CCE AI Suite (gpu-beta)</text>
  <text x="725" y="116" text-anchor="middle" fill="#889" font-size="9">enable_xgpu = true · enforces limits</text>

  <!-- Node frame -->
  <rect x="30" y="150" width="800" height="330" rx="12" fill="none" stroke="#3498db" stroke-dasharray="6 4"/>
  <text x="150" y="176" fill="#3498db" font-size="12" font-weight="600">GPU node · pi5e.2xlarge.4 · 1× NVIDIA L4 24 GB</text>

  <path d="M125,126 L125,194" stroke="#4a6fa5" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  <path d="M430,126 L430,148" stroke="#f39c12" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <path d="M725,126 L725,148" stroke="#2ecc71" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>

  <!-- Pods -->
  <rect x="50" y="196" width="250" height="84" rx="8" fill="url(#card)" stroke="#76b900"/>
  <text x="175.0" y="217" text-anchor="middle" fill="#76b900" font-size="12" font-weight="700">gpu-demo</text>
  <text x="175.0" y="235" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">13 GiB · 50 %</text>
  <text x="175.0" y="252" text-anchor="middle" fill="#889" font-size="9">SDXL-Turbo · Qwen · Whisper · Florence</text>
  <text x="175.0" y="267" text-anchor="middle" fill="#889" font-size="9">model manager budget = slice</text>
  <rect x="320" y="196" width="150" height="84" rx="8" fill="url(#card)" stroke="#38bdf8"/>
  <text x="395.0" y="217" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">gpu-demo-slice-small</text>
  <text x="395.0" y="235" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">2 GiB · 10 %</text>
  <text x="395.0" y="252" text-anchor="middle" fill="#889" font-size="9">slice worker</text>
  <text x="395.0" y="267" text-anchor="middle" fill="#889" font-size="9">bench · OOM test</text>
  <rect x="490" y="196" width="150" height="84" rx="8" fill="url(#card)" stroke="#a78bfa"/>
  <text x="565.0" y="217" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">gpu-demo-slice-medium</text>
  <text x="565.0" y="235" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">3 GiB · 15 %</text>
  <text x="565.0" y="252" text-anchor="middle" fill="#889" font-size="9">slice worker</text>
  <text x="565.0" y="267" text-anchor="middle" fill="#889" font-size="9">bench · OOM test</text>
  <rect x="660" y="196" width="150" height="84" rx="8" fill="url(#card)" stroke="#fbbf24"/>
  <text x="735.0" y="217" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">gpu-demo-slice-large</text>
  <text x="735.0" y="235" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">4 GiB · 25 %</text>
  <text x="735.0" y="252" text-anchor="middle" fill="#889" font-size="9">slice worker</text>
  <text x="735.0" y="267" text-anchor="middle" fill="#889" font-size="9">bench · OOM test</text>

  <!-- playground -> workers -->
  <path d="M175,280 L175,300 L735,300" stroke="#4a6fa5" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
  <path d="M395,300 L395,282" stroke="#4a6fa5" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ab)"/>
  <path d="M565,300 L565,282" stroke="#4a6fa5" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ab)"/>
  <path d="M735,300 L735,282" stroke="#4a6fa5" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#ab)"/>
  <text x="190" y="314" fill="#889" font-size="9">playground → workers (ClusterIP): GET /api/slice · POST /api/slice/bench · POST /api/slice/oom</text>

  <!-- L4 split -->
  <text x="50" y="352" fill="#e0e0e0" font-size="11" font-weight="600">VRAM</text>
  <text x="50" y="364" fill="#889" font-size="9">22 GiB</text>
  <rect x="110" y="336" width="700" height="26" rx="4" fill="#1a2340"/>
  <rect x="110.0" y="336" width="411.6" height="26" rx="4" fill="#76b900"/>
  <text x="118.0" y="353" fill="#0b1400" font-size="10" font-weight="700">playground 13 GiB</text>
  <rect x="523.6" y="336" width="61.6" height="26" rx="4" fill="#38bdf8"/>
  <text x="528.6" y="353" fill="#0b1400" font-size="9" font-weight="700">small 2 GiB</text>
  <rect x="587.3" y="336" width="93.5" height="26" rx="4" fill="#a78bfa"/>
  <text x="595.3" y="353" fill="#0b1400" font-size="10" font-weight="700">medium 3 GiB</text>
  <rect x="682.7" y="336" width="125.3" height="26" rx="4" fill="#fbbf24"/>
  <text x="690.7" y="353" fill="#0b1400" font-size="10" font-weight="700">large 4 GiB</text>
  <text x="50" y="396" fill="#e0e0e0" font-size="11" font-weight="600">Compute</text>
  <text x="50" y="408" fill="#889" font-size="9">100 %</text>
  <rect x="110" y="380" width="700" height="26" rx="4" fill="#1a2340"/>
  <rect x="110.0" y="380" width="348.0" height="26" rx="4" fill="#76b900"/>
  <text x="118.0" y="397" fill="#0b1400" font-size="10" font-weight="700">playground 50 %</text>
  <rect x="460.0" y="380" width="68.0" height="26" rx="4" fill="#38bdf8"/>
  <text x="468.0" y="397" fill="#0b1400" font-size="10" font-weight="700">small 10 %</text>
  <rect x="530.0" y="380" width="103.0" height="26" rx="4" fill="#a78bfa"/>
  <text x="538.0" y="397" fill="#0b1400" font-size="10" font-weight="700">medium 15 %</text>
  <rect x="635.0" y="380" width="173.0" height="26" rx="4" fill="#fbbf24"/>
  <text x="643.0" y="397" fill="#0b1400" font-size="10" font-weight="700">large 25 %</text>

  <text x="50" y="436" fill="#e0e0e0" font-size="10">volcano.sh/gpu-mem.128Mi = mem_gib × 8 · volcano.sh/gpu-core.percentage = core_percent</text>
  <text x="50" y="454" fill="#889" font-size="10">Each pod sees only its slice (nvidia-smi, torch.cuda.mem_get_info) · allocations beyond it fail · no burst into idle compute</text>

  <text x="430" y="508" text-anchor="middle" fill="#889" font-size="10">Default gpu_xgpu = false: the playground gets the whole GPU (nvidia.com/gpu: 1), no workers, no Volcano</text>
</svg>
