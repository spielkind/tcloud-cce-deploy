<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="ab" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#4dabf7"/></marker>
    <marker id="ap" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#b197fc"/></marker>
    <marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#51cf66"/></marker>
  </defs>

  <rect width="900" height="470" fill="url(#bg)" rx="12"/>
  <text x="450" y="30" fill="#e9ecef" font-size="18" font-weight="700" text-anchor="middle">Network Access Options for kubectl</text>

  <!-- Internet band -->
  <rect x="230" y="50" width="200" height="350" rx="8" fill="#212529" opacity="0.6"/>
  <text x="330" y="68" fill="#868e96" font-size="10" text-anchor="middle">Internet</text>

  <!-- VPC -->
  <rect x="470" y="50" width="410" height="350" rx="8" fill="none" stroke="#2a4a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="675" y="68" fill="#868e96" font-size="10" text-anchor="middle">VPC</text>

  <!-- API server -->
  <rect x="740" y="185" width="125" height="110" rx="8" fill="#364fc7" opacity="0.9"/>
  <text x="802" y="215" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">CCE API</text>
  <text x="802" y="232" fill="#fff" font-size="9" text-anchor="middle">kube-apiserver</text>
  <text x="802" y="250" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">private IP :5443</text>
  <text x="802" y="265" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">(+ EIP in option A)</text>
  <text x="802" y="282" fill="#fff" font-size="8" text-anchor="middle" opacity="0.7">same IAM + RBAC</text>

  <!-- ========== Option A ========== -->
  <text x="20" y="100" fill="#4dabf7" font-size="12" font-weight="700">A · API EIP + trust list</text>
  <rect x="20" y="110" width="140" height="45" rx="6" fill="#228be6" opacity="0.9"/>
  <text x="90" y="130" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Laptop</text>
  <text x="90" y="145" fill="#fff" font-size="8" text-anchor="middle" opacity="0.8">corporate egress IP</text>

  <rect x="280" y="113" width="100" height="40" rx="6" fill="#e8590c" opacity="0.9"/>
  <text x="330" y="131" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">API EIP</text>
  <text x="330" y="145" fill="#fff" font-size="8" text-anchor="middle">api_access_trustlist</text>

  <line x1="160" y1="132" x2="275" y2="132" stroke="#4dabf7" stroke-width="2" marker-end="url(#ab)"/>
  <text x="218" y="124" fill="#4dabf7" font-size="8" text-anchor="middle">https :5443</text>
  <path d="M380,132 L700,132 L700,205 L735,205" fill="none" stroke="#4dabf7" stroke-width="2" marker-end="url(#ab)"/>
  <text x="560" y="124" fill="#4dabf7" font-size="8" text-anchor="middle">today (trust list empty)</text>

  <!-- ========== Option B ========== -->
  <text x="20" y="215" fill="#b197fc" font-size="12" font-weight="700">B · VPN</text>
  <rect x="20" y="225" width="140" height="45" rx="6" fill="#228be6" opacity="0.9"/>
  <text x="90" y="245" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Laptop</text>
  <text x="90" y="260" fill="#fff" font-size="8" text-anchor="middle" opacity="0.8">corporate VPN / client</text>

  <rect x="280" y="228" width="100" height="40" rx="6" fill="#7048e8" opacity="0.9"/>
  <text x="330" y="246" fill="#fff" font-size="9" font-weight="700" text-anchor="middle">IPsec tunnel</text>
  <text x="330" y="260" fill="#fff" font-size="8" text-anchor="middle">or WireGuard</text>

  <rect x="500" y="225" width="150" height="45" rx="6" fill="#7048e8" opacity="0.75"/>
  <text x="575" y="244" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">VPN gateway / VM</text>
  <text x="575" y="259" fill="#fff" font-size="8" text-anchor="middle">Enterprise VPN or ECS</text>

  <line x1="160" y1="247" x2="275" y2="247" stroke="#b197fc" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="380" y1="247" x2="495" y2="247" stroke="#b197fc" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="650" y1="247" x2="735" y2="247" stroke="#b197fc" stroke-width="2" marker-end="url(#ap)"/>
  <text x="692" y="240" fill="#b197fc" font-size="8" text-anchor="middle">private :5443</text>

  <!-- ========== Option C ========== -->
  <text x="20" y="330" fill="#51cf66" font-size="12" font-weight="700">C · Jump host / bastion</text>
  <rect x="20" y="340" width="140" height="45" rx="6" fill="#228be6" opacity="0.9"/>
  <text x="90" y="360" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Laptop</text>
  <text x="90" y="375" fill="#fff" font-size="8" text-anchor="middle" opacity="0.8">ssh -D 1080 · proxy-url</text>

  <rect x="280" y="343" width="100" height="40" rx="6" fill="#e8590c" opacity="0.9"/>
  <text x="330" y="361" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Bastion EIP</text>
  <text x="330" y="375" fill="#fff" font-size="8" text-anchor="middle">SSH :22, trust list</text>

  <rect x="500" y="340" width="150" height="45" rx="6" fill="#0ca678" opacity="0.85"/>
  <text x="575" y="359" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">Bastion ECS</text>
  <text x="575" y="374" fill="#fff" font-size="8" text-anchor="middle">tunnel only, session log</text>

  <line x1="160" y1="362" x2="275" y2="362" stroke="#51cf66" stroke-width="2" marker-end="url(#ag)"/>
  <text x="218" y="354" fill="#51cf66" font-size="8" text-anchor="middle">SSH</text>
  <line x1="380" y1="362" x2="495" y2="362" stroke="#51cf66" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M650,362 L700,362 L700,290 L735,290" fill="none" stroke="#51cf66" stroke-width="2" marker-end="url(#ag)"/>
  <text x="692" y="355" fill="#51cf66" font-size="8" text-anchor="middle">private :5443</text>

  <!-- footer -->
  <text x="450" y="425" fill="#adb5bd" font-size="10" text-anchor="middle">A: simplest, works with GitHub-hosted runners · B: no Internet exposure, CI needs runner in VPC · C: only SSH exposed, extra keys</text>
  <text x="450" y="442" fill="#868e96" font-size="9" text-anchor="middle">Recommendation: dev → A with trust list · prod → B or C (+ self-hosted runner)</text>
</svg>
