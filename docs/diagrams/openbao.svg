<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6fa5"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9b59b6"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2ecc71"/></marker>
  </defs>

  <rect width="900" height="640" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">OpenBao on CCE</text>
  <text x="450" y="52" text-anchor="middle" fill="#889" font-size="9">openbao_mode = "cce" · Helm chart openbao · HA Raft · agent injector</text>

  <!-- User / CLI -->
  <rect x="370" y="64" width="160" height="32" rx="8" fill="#2d3a5a" stroke="#4a6fa5" stroke-width="1"/>
  <circle cx="404" cy="76" r="4" fill="none" stroke="#e0e0e0" stroke-width="1.3"/>
  <path d="M397,88 a7,6 0 0 1 14,0" fill="none" stroke="#e0e0e0" stroke-width="1.3"/>
  <text x="458" y="85" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">User / CLI / UI</text>
  <line x1="450" y1="96" x2="450" y2="124" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CCE Cluster -->
  <rect x="30" y="112" width="840" height="418" rx="10" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="134" fill="#3498db" font-size="11" font-weight="700">CCE Cluster</text>

  <!-- Ingress -->
  <rect x="320" y="126" width="260" height="28" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="450" y="144" text-anchor="middle" fill="#2ecc71" font-size="10.5" font-weight="600">nginx-ingress · TLS Let's Encrypt (cert-manager)</text>
  <line x1="450" y1="154" x2="450" y2="176" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="458" y="170" fill="#889" font-size="8">https://openbao.&lt;zone&gt;</text>

  <!-- Namespace openbao -->
  <rect x="50" y="178" width="800" height="158" rx="8" fill="none" stroke="#f1c40f" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="66" y="195" fill="#f1c40f" font-size="10" font-weight="700">namespace: openbao</text>
  <text x="834" y="195" text-anchor="end" fill="#889" font-size="8">svc: openbao · openbao-internal · openbao-active</text>

  <!-- OpenBao pods -->
  <rect x="70" y="204" width="200" height="70" rx="6" fill="url(#card)" stroke="#f39c12" stroke-width="1.5"/>
  <text x="170" y="222" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="700">openbao-0</text>
  <text x="170" y="237" text-anchor="middle" fill="#e0e0e0" font-size="9">leader (active)</text>
  <text x="170" y="252" text-anchor="middle" fill="#889" font-size="8">Raft · EVS PVC (csi-disk) · /openbao/data</text>
  <text x="170" y="266" text-anchor="middle" fill="#c39bd3" font-size="8">init container: unseal-trigger</text>

  <rect x="350" y="204" width="200" height="70" rx="6" fill="url(#card)" stroke="#f39c12" stroke-width="1"/>
  <text x="450" y="222" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="700">openbao-1</text>
  <text x="450" y="237" text-anchor="middle" fill="#e0e0e0" font-size="9">follower (standby)</text>
  <text x="450" y="252" text-anchor="middle" fill="#889" font-size="8">Raft · EVS PVC (csi-disk) · /openbao/data</text>
  <text x="450" y="266" text-anchor="middle" fill="#c39bd3" font-size="8">init container: unseal-trigger</text>

  <rect x="630" y="204" width="200" height="70" rx="6" fill="url(#card)" stroke="#f39c12" stroke-width="1"/>
  <text x="730" y="222" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="700">openbao-2</text>
  <text x="730" y="237" text-anchor="middle" fill="#e0e0e0" font-size="9">follower (standby)</text>
  <text x="730" y="252" text-anchor="middle" fill="#889" font-size="8">Raft · EVS PVC (csi-disk) · /openbao/data</text>
  <text x="730" y="266" text-anchor="middle" fill="#c39bd3" font-size="8">init container: unseal-trigger</text>

  <line x1="270" y1="239" x2="350" y2="239" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="550" y1="239" x2="630" y2="239" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="310" y="233" text-anchor="middle" fill="#f39c12" font-size="8">Raft</text>
  <text x="590" y="233" text-anchor="middle" fill="#f39c12" font-size="8">Raft</text>

  <!-- Injector -->
  <rect x="70" y="286" width="230" height="40" rx="6" fill="url(#card)" stroke="#9b59b6" stroke-width="1.2"/>
  <text x="185" y="303" text-anchor="middle" fill="#c39bd3" font-size="11" font-weight="600">openbao-agent-injector</text>
  <text x="185" y="318" text-anchor="middle" fill="#889" font-size="8">MutatingWebhookConfiguration</text>

  <!-- Kubernetes auth -->
  <rect x="320" y="286" width="510" height="40" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="575" y="303" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">auth/kubernetes · KV v2 at kv/</text>
  <text x="575" y="318" text-anchor="middle" fill="#889" font-size="8">ServiceAccount JWT validated via TokenReview (kubernetes.default.svc) → role → policy</text>

  <!-- App namespaces -->
  <rect x="50" y="352" width="800" height="160" rx="8" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4,2" stroke-opacity="0.7"/>
  <text x="834" y="369" text-anchor="end" fill="#2ecc71" font-size="10" font-weight="700">app namespaces (e.g. demo-app)</text>

  <!-- Pod A (injected) -->
  <rect x="70" y="380" width="260" height="120" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="200" y="396" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="700">App Pod (annotated)</text>
  <rect x="85" y="404" width="110" height="30" rx="4" fill="#0d1117" stroke="#2ecc71" stroke-width="0.8"/>
  <text x="140" y="423" text-anchor="middle" fill="#2ecc71" font-size="9">app</text>
  <rect x="205" y="404" width="110" height="30" rx="4" fill="#0d1117" stroke="#9b59b6" stroke-width="0.8"/>
  <text x="260" y="423" text-anchor="middle" fill="#c39bd3" font-size="9">openbao-agent</text>
  <rect x="85" y="442" width="230" height="22" rx="4" fill="#141c30" stroke="#3a4a6a" stroke-width="0.8"/>
  <text x="200" y="457" text-anchor="middle" fill="#aab" font-size="8.5">/vault/secrets (emptyDir, shared)</text>
  <text x="200" y="488" text-anchor="middle" fill="#889" font-size="8">vault.hashicorp.com/agent-inject: "true"</text>

  <!-- Pod B (injected) -->
  <rect x="350" y="380" width="260" height="120" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="480" y="396" text-anchor="middle" fill="#2ecc71" font-size="10" font-weight="700">App Pod (annotated)</text>
  <rect x="365" y="404" width="110" height="30" rx="4" fill="#0d1117" stroke="#2ecc71" stroke-width="0.8"/>
  <text x="420" y="423" text-anchor="middle" fill="#2ecc71" font-size="9">app</text>
  <rect x="485" y="404" width="110" height="30" rx="4" fill="#0d1117" stroke="#9b59b6" stroke-width="0.8"/>
  <text x="540" y="423" text-anchor="middle" fill="#c39bd3" font-size="9">openbao-agent</text>
  <rect x="365" y="442" width="230" height="22" rx="4" fill="#141c30" stroke="#3a4a6a" stroke-width="0.8"/>
  <text x="480" y="457" text-anchor="middle" fill="#aab" font-size="8.5">/vault/secrets (emptyDir, shared)</text>
  <text x="480" y="488" text-anchor="middle" fill="#889" font-size="8">agent-inject-secret-config: kv/data/…</text>

  <!-- Pod C (no injection) -->
  <rect x="630" y="380" width="200" height="120" rx="6" fill="none" stroke="#667" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="730" y="396" text-anchor="middle" fill="#aab" font-size="10" font-weight="700">Pod (no annotation)</text>
  <rect x="660" y="404" width="140" height="30" rx="4" fill="#0d1117" stroke="#667" stroke-width="0.8"/>
  <text x="730" y="423" text-anchor="middle" fill="#aab" font-size="9">app only</text>
  <text x="730" y="457" text-anchor="middle" fill="#889" font-size="8.5">not mutated · no sidecar</text>
  <text x="730" y="488" text-anchor="middle" fill="#889" font-size="8">may still use the API directly</text>

  <!-- Mutate arrows -->
  <line x1="140" y1="326" x2="140" y2="377" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-p)"/>
  <text x="146" y="373" fill="#9b59b6" font-size="8" font-style="italic">mutate</text>
  <path d="M240,326 V344 H420 V377" fill="none" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-p)"/>

  <!-- Agent login -->
  <line x1="540" y1="404" x2="540" y2="329" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="546" y="373" fill="#2ecc71" font-size="8" font-style="italic">login (SA JWT) → read kv</text>

  <!-- Setup flow -->
  <rect x="30" y="544" width="840" height="46" rx="6" fill="#141c30"/>
  <text x="50" y="562" fill="#aaa" font-size="9" font-weight="600">Setup (one-time):</text>
  <text x="50" y="580" fill="#889" font-size="9">tofu apply → openbao-init.sh → upload unseal keys to OBS (KMS-encrypted) → auto-unseal via Init Container + FunctionGraph</text>

  <!-- Footer -->
  <text x="450" y="610" text-anchor="middle" fill="#556" font-size="9">Unseal keys KMS-encrypted in OBS · Root token revoked after setup · Auto-unseal via FunctionGraph on pod restart</text>
  <text x="450" y="626" text-anchor="middle" fill="#445" font-size="8">See docs/openbao-unseal.md for auto-unseal architecture</text>
</svg>
