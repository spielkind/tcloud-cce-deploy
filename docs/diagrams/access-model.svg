<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="ab" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#4dabf7"/></marker>
    <marker id="ay" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#ffd43b"/></marker>
    <marker id="ag" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#51cf66"/></marker>
  </defs>

  <rect width="900" height="480" fill="url(#bg)" rx="12"/>
  <text x="450" y="30" fill="#e9ecef" font-size="18" font-weight="700" text-anchor="middle">Developer Access Model (concept)</text>

  <!-- Developer laptop -->
  <rect x="30" y="70" width="150" height="90" rx="8" fill="#228be6" opacity="0.9"/>
  <text x="105" y="95" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Developer laptop</text>
  <text x="105" y="114" fill="#fff" font-size="9" text-anchor="middle">kubectl</text>
  <text x="105" y="128" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">personal kubeconfig</text>
  <text x="105" y="142" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">(cert CN = IAM user ID)</text>

  <!-- IdP (optional) -->
  <rect x="30" y="220" width="150" height="55" rx="8" fill="none" stroke="#7048e8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="105" y="242" fill="#b197fc" font-size="11" font-weight="700" text-anchor="middle">Corporate IdP</text>
  <text x="105" y="258" fill="#b197fc" font-size="9" text-anchor="middle">optional (SAML/OIDC)</text>

  <!-- IAM -->
  <rect x="270" y="190" width="270" height="140" rx="8" fill="#fab005" opacity="0.9"/>
  <text x="405" y="212" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">IAM (per env project)</text>
  <text x="285" y="234" fill="#1a1a2e" font-size="10">cce-&lt;env&gt;-platform-admins → CCE Administrator</text>
  <text x="285" y="252" fill="#1a1a2e" font-size="10">cce-&lt;env&gt;-cluster-viewers</text>
  <text x="285" y="270" fill="#1a1a2e" font-size="10">cce-&lt;env&gt;-&lt;team&gt;-admins</text>
  <text x="285" y="288" fill="#1a1a2e" font-size="10">cce-&lt;env&gt;-&lt;team&gt;-developers</text>
  <text x="285" y="306" fill="#1a1a2e" font-size="10">cce-&lt;env&gt;-&lt;team&gt;-viewers</text>
  <text x="405" y="323" fill="#1a1a2e" font-size="9" text-anchor="middle" opacity="0.75">all other groups → CCE ReadOnlyAccess · groups only</text>

  <!-- IdP → IAM -->
  <line x1="180" y1="247" x2="265" y2="247" stroke="#7048e8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ay)"/>
  <text x="222" y="240" fill="#b197fc" font-size="8" text-anchor="middle">group mapping</text>

  <!-- Step 1: get kubeconfig -->
  <path d="M180,140 L330,140 L330,185" fill="none" stroke="#ffd43b" stroke-width="2" marker-end="url(#ay)"/>
  <circle cx="250" cy="140" r="10" fill="#e9ecef"/>
  <text x="250" y="144" fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">1</text>
  <text x="250" y="125" fill="#ffd43b" font-size="9" text-anchor="middle">clustercert (short validity)</text>

  <!-- Network layer -->
  <rect x="270" y="65" width="270" height="45" rx="6" fill="#495057" opacity="0.9"/>
  <text x="405" y="84" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Network: EIP + trust list | VPN | jump host</text>
  <text x="405" y="100" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">see access-network.svg</text>

  <!-- Step 2: kubectl → API -->
  <line x1="180" y1="90" x2="265" y2="90" stroke="#4dabf7" stroke-width="2"/>
  <line x1="540" y1="90" x2="605" y2="90" stroke="#4dabf7" stroke-width="2" marker-end="url(#ab)"/>
  <circle cx="222" cy="90" r="10" fill="#e9ecef"/>
  <text x="222" y="94" fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">2</text>
  <text x="572" y="80" fill="#4dabf7" font-size="9" text-anchor="middle">mTLS :5443</text>

  <!-- CCE cluster -->
  <rect x="610" y="55" width="270" height="400" rx="8" fill="none" stroke="#2a4a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="745" y="72" fill="#868e96" font-size="10" text-anchor="middle">CCE cluster (dev / prod)</text>

  <rect x="625" y="80" width="240" height="50" rx="6" fill="#364fc7" opacity="0.9"/>
  <text x="745" y="100" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">kube-apiserver</text>
  <text x="745" y="117" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">user ID + IAM group IDs → RBAC</text>

  <!-- IAM → apiserver (group resolution) -->
  <path d="M540,230 L590,230 L590,120 L620,120" fill="none" stroke="#ffd43b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ay)"/>
  <circle cx="590" cy="175" r="10" fill="#e9ecef"/>
  <text x="590" y="179" fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">3</text>

  <!-- RBAC -->
  <rect x="625" y="145" width="240" height="95" rx="6" fill="#0ca678" opacity="0.9"/>
  <text x="745" y="164" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">RBAC (ClusterRoles)</text>
  <text x="637" y="182" fill="#fff" font-size="9">cluster-admin · cluster-viewer</text>
  <text x="637" y="197" fill="#fff" font-size="9">admin (namespace-admin)</text>
  <text x="637" y="212" fill="#fff" font-size="9">namespace-developer (edit − read secrets)</text>
  <text x="637" y="227" fill="#fff" font-size="9">view (namespace-viewer)</text>

  <line x1="745" y1="130" x2="745" y2="142" stroke="#51cf66" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="745" y1="240" x2="745" y2="255" stroke="#51cf66" stroke-width="2" marker-end="url(#ag)"/>
  <text x="755" y="252" fill="#51cf66" font-size="8">RoleBinding → Group &lt;IAM group ID&gt;</text>

  <!-- Team namespaces -->
  <rect x="625" y="260" width="115" height="110" rx="6" fill="#1c7ed6" opacity="0.85"/>
  <text x="682" y="279" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">team-a</text>
  <text x="682" y="297" fill="#fff" font-size="8" text-anchor="middle">PSA restricted</text>
  <text x="682" y="311" fill="#fff" font-size="8" text-anchor="middle">ResourceQuota</text>
  <text x="682" y="325" fill="#fff" font-size="8" text-anchor="middle">LimitRange</text>
  <text x="682" y="339" fill="#fff" font-size="8" text-anchor="middle">NetworkPolicy</text>
  <text x="682" y="357" fill="#fff" font-size="8" text-anchor="middle" opacity="0.7">default deny</text>

  <rect x="750" y="260" width="115" height="110" rx="6" fill="#1c7ed6" opacity="0.85"/>
  <text x="807" y="279" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">team-b</text>
  <text x="807" y="297" fill="#fff" font-size="8" text-anchor="middle">PSA restricted</text>
  <text x="807" y="311" fill="#fff" font-size="8" text-anchor="middle">ResourceQuota</text>
  <text x="807" y="325" fill="#fff" font-size="8" text-anchor="middle">LimitRange</text>
  <text x="807" y="339" fill="#fff" font-size="8" text-anchor="middle">NetworkPolicy</text>
  <text x="807" y="357" fill="#fff" font-size="8" text-anchor="middle" opacity="0.7">default deny</text>

  <rect x="625" y="380" width="240" height="60" rx="6" fill="#495057" opacity="0.9"/>
  <text x="745" y="400" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">platform namespaces</text>
  <text x="745" y="416" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">kube-system · openbao · cert-manager · default</text>
  <text x="745" y="430" fill="#ff8787" font-size="9" text-anchor="middle">no developer bindings</text>

  <!-- CI path -->
  <rect x="30" y="370" width="150" height="70" rx="8" fill="#495057" opacity="0.9"/>
  <text x="105" y="392" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">CI (GitHub Actions)</text>
  <text x="105" y="409" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">admin certificate</text>
  <text x="105" y="423" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">workloads stack only</text>
  <path d="M180,405 L595,405 L595,125 L620,125" fill="none" stroke="#868e96" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- dev/prod legend -->
  <rect x="270" y="355" width="270" height="35" rx="6" fill="none" stroke="#868e96" stroke-width="1"/>
  <text x="405" y="369" fill="#e9ecef" font-size="10" font-weight="700" text-anchor="middle">dev: developers write in team namespaces</text>
  <text x="405" y="383" fill="#e9ecef" font-size="10" text-anchor="middle">prod: developers read-only, writes via CI</text>

  <text x="450" y="468" fill="#868e96" font-size="9" text-anchor="middle">Tenant Administrator / CCE Administrator bypass RBAC — never assigned to developers</text>
</svg>
