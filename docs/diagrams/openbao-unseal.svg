<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="ar-orange" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#ff922b"/></marker>
    <marker id="ar-purple" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#845ef7"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#4dabf7"/></marker>
    <marker id="ar-green" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#51cf66"/></marker>
    <marker id="ar-grey" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#adb5bd"/></marker>
  </defs>

  <rect width="960" height="440" fill="url(#bg)" rx="12"/>
  <text x="480" y="28" fill="#e9ecef" font-size="16" font-weight="700" text-anchor="middle">OpenBao Auto-Unseal — Native Sidecar</text>
  <text x="480" y="46" fill="#868e96" font-size="10" text-anchor="middle">keys stay inside the pod · KMS via workload identity · no extra listener, no network path for plaintext</text>

  <!-- Pod frame -->
  <rect x="20" y="62" width="520" height="250" rx="8" fill="none" stroke="#2a4a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="280" y="80" fill="#868e96" font-size="10" text-anchor="middle">CCE cluster · OpenBao pod (StatefulSet openbao-N, ns openbao, SA openbao)</text>

  <!-- OpenBao server -->
  <rect x="40" y="95" width="220" height="120" rx="8" fill="#1f2a44" stroke="#51cf66" stroke-width="1.5"/>
  <text x="150" y="116" fill="#8ce99a" font-size="12" font-weight="700" text-anchor="middle">openbao (server)</text>
  <text x="150" y="133" fill="#adb5bd" font-size="9" text-anchor="middle">127.0.0.1:8200 · Raft</text>
  <text x="150" y="160" fill="#ced4da" font-size="9" text-anchor="middle">sealed after every start</text>
  <text x="150" y="175" fill="#ced4da" font-size="9" text-anchor="middle">unchanged: ingress :443, Raft :8201</text>

  <!-- Sidecar -->
  <rect x="300" y="95" width="220" height="120" rx="8" fill="#1f2a44" stroke="#845ef7" stroke-width="1.5"/>
  <text x="410" y="116" fill="#b197fc" font-size="12" font-weight="700" text-anchor="middle">auto-unseal (native sidecar)</text>
  <text x="410" y="133" fill="#adb5bd" font-size="9" text-anchor="middle">init container · restartPolicy: Always</text>
  <text x="315" y="153" fill="#ced4da" font-size="9">every 30 s: seal-status</text>
  <text x="315" y="168" fill="#ced4da" font-size="9">initialized + sealed →</text>
  <text x="325" y="183" fill="#ced4da" font-size="9">① IAM token ② KMS decrypt</text>
  <text x="325" y="198" fill="#ced4da" font-size="9">③ PUT /v1/sys/unseal</text>

  <path d="M298,140 L262,140" stroke="#51cf66" stroke-width="1.6" fill="none" marker-end="url(#ar-green)"/>
  <path d="M262,170 L298,170" stroke="#adb5bd" stroke-width="1.2" fill="none" marker-end="url(#ar-grey)"/>
  <text x="280" y="133" fill="#8ce99a" font-size="8" text-anchor="middle">③ localhost</text>
  <text x="280" y="184" fill="#adb5bd" font-size="8" text-anchor="middle">status</text>

  <!-- Volumes (mounted into the sidecar) -->
  <rect x="40" y="235" width="150" height="62" rx="6" fill="#16213e" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="115" y="253" fill="#dee2e6" font-size="10" font-weight="600" text-anchor="middle">ConfigMap</text>
  <text x="115" y="269" fill="#adb5bd" font-size="8.5" text-anchor="middle">openbao-unseal-script</text>
  <text x="115" y="283" fill="#adb5bd" font-size="8.5" text-anchor="middle">files/openbao-auto-unseal.py</text>

  <rect x="205" y="235" width="150" height="62" rx="6" fill="#16213e" stroke="#4dabf7" stroke-width="1.2"/>
  <text x="280" y="253" fill="#74c0fc" font-size="10" font-weight="600" text-anchor="middle">projected SA token</text>
  <text x="280" y="269" fill="#adb5bd" font-size="8.5" text-anchor="middle">audience: workload identity</text>
  <text x="280" y="283" fill="#adb5bd" font-size="8.5" text-anchor="middle">/var/run/secrets/tokens</text>

  <rect x="370" y="235" width="150" height="62" rx="6" fill="#16213e" stroke="#ff922b" stroke-width="1.2"/>
  <text x="445" y="253" fill="#ffa94d" font-size="10" font-weight="600" text-anchor="middle">Secret openbao-unseal-keys</text>
  <text x="445" y="269" fill="#adb5bd" font-size="8.5" text-anchor="middle">keys.enc = KMS ciphertext</text>
  <text x="445" y="283" fill="#adb5bd" font-size="8.5" text-anchor="middle">optional mount</text>

  <path d="M115,235 L115,225 L315,225 L315,218" stroke="#adb5bd" stroke-width="1.1" fill="none" marker-end="url(#ar-grey)"/>
  <path d="M340,235 L355,218" stroke="#4dabf7" stroke-width="1.2" fill="none" marker-end="url(#ar-blue)"/>
  <path d="M445,235 L430,217" stroke="#ff922b" stroke-width="1.2" fill="none" marker-end="url(#ar-orange)"/>

  <!-- T-Cloud services -->
  <rect x="600" y="62" width="340" height="250" rx="8" fill="none" stroke="#2a4a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="770" y="80" fill="#868e96" font-size="10" text-anchor="middle">T-Cloud APIs (infra stack)</text>

  <rect x="620" y="95" width="300" height="70" rx="8" fill="#1f2a44" stroke="#4dabf7" stroke-width="1.5"/>
  <text x="770" y="115" fill="#74c0fc" font-size="11" font-weight="700" text-anchor="middle">IAM · workload identity (OIDC)</text>
  <text x="770" y="132" fill="#ced4da" font-size="9" text-anchor="middle">sub = system:serviceaccount:openbao:openbao</text>
  <text x="770" y="147" fill="#ced4da" font-size="9" text-anchor="middle">→ IAM group with role ${name_prefix}-kms-decrypt</text>

  <rect x="620" y="185" width="300" height="70" rx="8" fill="#1f2a44" stroke="#ff922b" stroke-width="1.5"/>
  <text x="770" y="205" fill="#ffa94d" font-size="11" font-weight="700" text-anchor="middle">KMS key ${name_prefix}-openbao-unseal-*</text>
  <text x="770" y="222" fill="#ced4da" font-size="9" text-anchor="middle">decrypt-data · role scoped to kms:::KeyId:&lt;this key&gt;</text>
  <text x="770" y="237" fill="#ced4da" font-size="9" text-anchor="middle">plain_text = base64("key1,key2,…")</text>

  <path d="M520,125 L618,125" stroke="#4dabf7" stroke-width="1.5" fill="none" marker-end="url(#ar-blue)"/>
  <text x="560" y="118" fill="#74c0fc" font-size="8.5" text-anchor="middle">① SA token</text>
  <path d="M520,200 L618,200" stroke="#ff922b" stroke-width="1.5" fill="none" marker-end="url(#ar-orange)"/>
  <text x="560" y="193" fill="#ffa94d" font-size="8.5" text-anchor="middle">② ciphertext</text>

  <!-- Setup -->
  <rect x="20" y="330" width="920" height="92" rx="8" fill="#16213e" stroke="#2a4a6b" stroke-width="1"/>
  <text x="40" y="352" fill="#e9ecef" font-size="11" font-weight="700">Setup</text>
  <text x="40" y="372" fill="#ced4da" font-size="9.5">openbao-init.sh → init, unseal, raft join → upload-unseal-keys.py: checks env + cluster ID, KMS encrypt → Secret openbao-unseal-keys</text>
  <text x="40" y="390" fill="#ced4da" font-size="9.5">Every pod start or OpenBao container restart: the sidecar unseals within seconds. Deliberate seal: scripts/openbao-seal.sh (pauses all sidecars, then seals).</text>
  <text x="40" y="408" fill="#868e96" font-size="9">Plaintext shares exist only in the sidecar's memory (python:3.12-alpine, stdlib) and on 127.0.0.1 — never in argv, files or logs.</text>
</svg>
