<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="arrO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f39c12"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#27ae60"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e74c3c"/></marker>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9b59b6"/></marker>
  </defs>

  <rect width="900" height="784" rx="12" fill="url(#bg)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- TITLE -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="450" y="32" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">T-Cloud — CCE Turbo Deployment</text>
  <text x="450" y="50" text-anchor="middle" fill="#888" font-size="11">eu-de · test-cluster</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- INTERNET -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="340" y="62" width="220" height="36" rx="18" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="450" y="85" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">☁  Internet</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- EIPs — three clearly separate entry/exit points -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="60" y="122" width="180" height="48" rx="8" fill="#1e2a4a" stroke="#58a6ff" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="143" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">⬇ EIP — Kube API</text>
  <text x="150" y="160" text-anchor="middle" fill="#889" font-size="9">kubectl :5443</text>

  <rect x="310" y="122" width="180" height="48" rx="8" fill="#1e2a4a" stroke="#f39c12" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="143" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="700">⬇ EIP — Ingress</text>
  <text x="400" y="160" text-anchor="middle" fill="#889" font-size="9">*.otc.nodefall.de :80/443</text>

  <rect x="660" y="122" width="180" height="48" rx="8" fill="#1e2a4a" stroke="#9b59b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="143" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="700">⬆ EIP — NAT</text>
  <text x="750" y="160" text-anchor="middle" fill="#889" font-size="9">outbound SNAT</text>

  <!-- Arrows: Internet ↔ EIPs -->
  <line x1="380" y1="98" x2="190" y2="120" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrB)"/>
  <line x1="420" y1="98" x2="400" y2="120" stroke="#f39c12" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrO)"/>
  <line x1="750" y1="120" x2="520" y2="98" stroke="#9b59b6" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrP)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- VPC -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="30" y="190" width="840" height="414" rx="10" fill="none" stroke="#e20074" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <text x="50" y="210" fill="#e20074" font-size="12" font-weight="700">VPC  10.248.0.0/16</text>

  <!-- Subnet -->
  <rect x="50" y="220" width="800" height="370" rx="8" fill="#141c30" stroke="#3a4a6a" stroke-width="1"/>
  <text x="70" y="242" fill="#aab" font-size="11" font-weight="600">Node Subnet  10.248.0.0/24  ·  ENI Subnet  10.248.128.0/18</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- NAT Gateway — in subnet, OUTSIDE cluster -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="650" y="232" width="185" height="48" rx="8" fill="#2a2040" stroke="#9b59b6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="742" y="254" text-anchor="middle" fill="#c39bd3" font-size="11" font-weight="700">NAT Gateway</text>
  <text x="742" y="268" text-anchor="middle" fill="#889" font-size="9">SNAT for nodes + pods</text>
  <!-- Arrow: NAT GW → EIP NAT -->
  <line x1="750" y1="232" x2="750" y2="172" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrP)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ELB — in subnet, OUTSIDE cluster -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="340" y="232" width="200" height="48" rx="8" fill="#2a2040" stroke="#f39c12" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="440" y="254" text-anchor="middle" fill="#f39c12" font-size="11" font-weight="700">ELB  (LoadBalancer v2)</text>
  <text x="440" y="268" text-anchor="middle" fill="#889" font-size="9">→ nginx-ingress pods</text>
  <!-- Arrow: EIP Ingress → ELB -->
  <line x1="400" y1="170" x2="400" y2="230" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrO)"/>

  <!-- Arrow: EIP API → cluster API -->
  <line x1="150" y1="170" x2="150" y2="305" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CCE Cluster -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="65" y="300" width="570" height="270" rx="8" fill="#1a2540" stroke="#4a6fa5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="322" fill="#6ba3d6" font-size="13" font-weight="700">CCE Cluster</text>
  <text x="230" y="322" fill="#889" font-size="10">eni (Yangtse) · rbac · ipvs · v1.35</text>

  <!-- Cluster components row -->
  <rect x="85" y="332" width="120" height="22" rx="11" fill="#162040" stroke="#58a6ff" stroke-width="1"/>
  <text x="145" y="347" text-anchor="middle" fill="#58a6ff" font-size="9" font-weight="600">API Server :5443</text>

  <rect x="215" y="332" width="120" height="22" rx="11" fill="#1e3a2a" stroke="#27ae60" stroke-width="1"/>
  <text x="275" y="347" text-anchor="middle" fill="#27ae60" font-size="9" font-weight="600">nginx-ingress 6.0.24</text>

  <rect x="345" y="332" width="120" height="22" rx="11" fill="#2a1a2a" stroke="#e74c3c" stroke-width="1"/>
  <text x="405" y="347" text-anchor="middle" fill="#e74c3c" font-size="9" font-weight="600">cert-manager v1.21.3</text>

  <rect x="475" y="332" width="145" height="22" rx="11" fill="#2a1a3a" stroke="#9b59b6" stroke-width="1"/>
  <text x="547" y="347" text-anchor="middle" fill="#c39bd3" font-size="9">Security Group</text>

  <!-- Arrow: ELB → nginx-ingress -->
  <line x1="440" y1="280" x2="290" y2="330" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrG)"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- Worker Nodes (AZs) -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="85" y="366" width="170" height="152" rx="6" fill="#223050" stroke="#4a6fa5" stroke-width="1"/>
  <text x="170" y="386" text-anchor="middle" fill="#6ba3d6" font-size="10" font-weight="600">eu-de-01</text>
  <rect x="100" y="396" width="140" height="34" rx="4" fill="#2a3a5a"/>
  <text x="170" y="414" text-anchor="middle" fill="#ccc" font-size="10">Worker Node</text>
  <text x="170" y="426" text-anchor="middle" fill="#889" font-size="8">s7n.xlarge.2 · HCE OS 2.0</text>
  <rect x="100" y="436" width="65" height="22" rx="3" fill="#1e3a2a" stroke="#27ae60" stroke-width="0.5"/>
  <text x="132" y="451" text-anchor="middle" fill="#27ae60" font-size="8">podinfo</text>
  <rect x="170" y="436" width="70" height="22" rx="3" fill="#1e2a3a" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="205" y="451" text-anchor="middle" fill="#58a6ff" font-size="8">nginx-ing.</text>
  <rect x="100" y="462" width="65" height="22" rx="3" fill="#2a1a2a" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="132" y="477" text-anchor="middle" fill="#e74c3c" font-size="8">cert-mgr</text>
  <rect x="170" y="462" width="70" height="22" rx="3" fill="#1a2a3a" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="205" y="477" text-anchor="middle" fill="#e74c3c" font-size="8">log-agent</text>
  <rect x="100" y="490" width="140" height="18" rx="3" fill="#0d1117" opacity="0.5"/>
  <text x="170" y="503" text-anchor="middle" fill="#f1c40f" font-size="7">openbao-0 · demo-app</text>

  <rect x="268" y="366" width="170" height="152" rx="6" fill="#223050" stroke="#4a6fa5" stroke-width="1"/>
  <text x="353" y="386" text-anchor="middle" fill="#6ba3d6" font-size="10" font-weight="600">eu-de-02</text>
  <rect x="283" y="396" width="140" height="34" rx="4" fill="#2a3a5a"/>
  <text x="353" y="414" text-anchor="middle" fill="#ccc" font-size="10">Worker Node</text>
  <text x="353" y="426" text-anchor="middle" fill="#889" font-size="8">s7n.xlarge.2 · HCE OS 2.0</text>
  <rect x="283" y="436" width="65" height="22" rx="3" fill="#1e3a2a" stroke="#27ae60" stroke-width="0.5"/>
  <text x="315" y="451" text-anchor="middle" fill="#27ae60" font-size="8">podinfo</text>
  <rect x="353" y="436" width="70" height="22" rx="3" fill="#1e2a3a" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="388" y="451" text-anchor="middle" fill="#58a6ff" font-size="8">nginx-ing.</text>
  <rect x="283" y="462" width="140" height="22" rx="3" fill="#1a2a3a" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="353" y="477" text-anchor="middle" fill="#e74c3c" font-size="8">log-agent</text>
  <rect x="283" y="490" width="140" height="18" rx="3" fill="#0d1117" opacity="0.5"/>
  <text x="353" y="503" text-anchor="middle" fill="#f1c40f" font-size="7">openbao-1</text>

  <rect x="451" y="366" width="170" height="152" rx="6" fill="#223050" stroke="#4a6fa5" stroke-width="1"/>
  <text x="536" y="386" text-anchor="middle" fill="#6ba3d6" font-size="10" font-weight="600">eu-de-03</text>
  <rect x="466" y="396" width="140" height="34" rx="4" fill="#2a3a5a"/>
  <text x="536" y="414" text-anchor="middle" fill="#ccc" font-size="10">Worker Node</text>
  <text x="536" y="426" text-anchor="middle" fill="#889" font-size="8">s7n.xlarge.2 · HCE OS 2.0</text>
  <rect x="466" y="436" width="65" height="22" rx="3" fill="#1e3a2a" stroke="#27ae60" stroke-width="0.5"/>
  <text x="498" y="451" text-anchor="middle" fill="#27ae60" font-size="8">podinfo</text>
  <rect x="536" y="436" width="70" height="22" rx="3" fill="#1e2a3a" stroke="#58a6ff" stroke-width="0.5"/>
  <text x="571" y="451" text-anchor="middle" fill="#58a6ff" font-size="8">nginx-ing.</text>
  <rect x="466" y="462" width="140" height="22" rx="3" fill="#1a2a3a" stroke="#e74c3c" stroke-width="0.5"/>
  <text x="536" y="477" text-anchor="middle" fill="#e74c3c" font-size="8">log-agent</text>
  <rect x="466" y="490" width="140" height="18" rx="3" fill="#0d1117" opacity="0.5"/>
  <text x="536" y="503" text-anchor="middle" fill="#f1c40f" font-size="7">openbao-2</text>

  <!-- GPU node pool (optional, autoscaled 0..1) -->
  <rect x="85" y="526" width="536" height="34" rx="6" fill="#1c2a1a" stroke="#76b900" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="97" y="541" fill="#76b900" font-size="10" font-weight="700">GPU Node Pool</text>
  <text x="97" y="553" fill="#889" font-size="8">pi5e.2xlarge.4 · 1× NVIDIA L4 24 GB · eu-de-01 · autoscaled 0…1 · taint nvidia.com/gpu</text>
  <rect x="470" y="532" width="140" height="22" rx="3" fill="#1e3a1a" stroke="#76b900" stroke-width="0.5"/>
  <text x="540" y="547" text-anchor="middle" fill="#a3e635" font-size="8">gpu-demo · image.&lt;zone&gt;</text>

  <!-- Arrow: Workers → NAT GW (outbound) -->
  <path d="M636,430 C645,390 645,330 742,282" stroke="#9b59b6" stroke-width="1.2" fill="none" stroke-dasharray="4 2" marker-end="url(#arrP)"/>
  <text x="675" y="350" fill="#9b59b6" font-size="8" font-style="italic" transform="rotate(-75,675,350)">image pull</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LTS (outside VPC, managed service) -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="660" y="400" width="175" height="76" rx="8" fill="#1e2a4a" stroke="#e74c3c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="747" y="422" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="700">LTS</text>
  <text x="747" y="438" text-anchor="middle" fill="#889" font-size="8">Log Tank Service</text>
  <text x="747" y="452" text-anchor="middle" fill="#666" font-size="8">container · cluster</text>
  <text x="747" y="464" text-anchor="middle" fill="#666" font-size="8">audit · node logs</text>

  <!-- Arrow: log-agent → LTS -->
  <line x1="622" y1="473" x2="658" y2="450" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arrR)"/>
  <text x="628" y="430" fill="#e74c3c" font-size="8" font-style="italic">logs</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- SUPPORTING SERVICES -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="450" y="634" text-anchor="middle" fill="#555" font-size="9" font-weight="600" letter-spacing="2">SUPPORTING SERVICES</text>

  <rect x="60" y="646" width="180" height="36" rx="6" fill="#1e2a4a" stroke="#e20074" stroke-width="1"/>
  <text x="150" y="665" text-anchor="middle" fill="#e20074" font-size="10" font-weight="700">OBS</text>
  <text x="150" y="677" text-anchor="middle" fill="#889" font-size="8">State Backend (KMS-encrypted)</text>

  <rect x="260" y="646" width="180" height="36" rx="6" fill="#1e2a4a" stroke="#27ae60" stroke-width="1"/>
  <text x="350" y="665" text-anchor="middle" fill="#27ae60" font-size="10" font-weight="700">IAM</text>
  <text x="350" y="677" text-anchor="middle" fill="#889" font-size="8">cce_admin_trust Agency</text>

  <rect x="460" y="646" width="180" height="36" rx="6" fill="#1e2a4a" stroke="#3498db" stroke-width="1"/>
  <text x="550" y="665" text-anchor="middle" fill="#3498db" font-size="10" font-weight="700">DNS</text>
  <text x="550" y="677" text-anchor="middle" fill="#889" font-size="8">*.otc.nodefall.de</text>

  <rect x="660" y="646" width="180" height="36" rx="6" fill="#1e2a4a" stroke="#e67e22" stroke-width="1"/>
  <text x="750" y="665" text-anchor="middle" fill="#e67e22" font-size="10" font-weight="700">KMS</text>
  <text x="750" y="677" text-anchor="middle" fill="#889" font-size="8">State + OpenBao unseal keys</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- GITHUB ACTIONS -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="60" y="704" width="780" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="724" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">GitHub Actions</text>
  <text x="450" y="740" text-anchor="middle" fill="#889" font-size="9">Infra (VPC · CCE · DNS · NAT · ELB · Ingress · LTS · SWR)  →  Build Images (optional)  →  Apps (cert-manager · podinfo · OpenBao · demo · gpu-demo)</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="60" y="762" width="780" height="1" fill="#222"/>
  <line x1="80" y1="776" x2="110" y2="776" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="780" fill="#889" font-size="9">kubectl</text>
  <line x1="190" y1="776" x2="220" y2="776" stroke="#f39c12" stroke-width="2"/>
  <text x="225" y="780" fill="#889" font-size="9">http traffic</text>
  <line x1="330" y1="776" x2="360" y2="776" stroke="#9b59b6" stroke-width="2"/>
  <text x="365" y="780" fill="#889" font-size="9">outbound (NAT)</text>
  <line x1="490" y1="776" x2="520" y2="776" stroke="#27ae60" stroke-width="2"/>
  <text x="525" y="780" fill="#889" font-size="9">ingress routing</text>
  <line x1="640" y1="776" x2="670" y2="776" stroke="#e74c3c" stroke-width="2"/>
  <text x="675" y="780" fill="#889" font-size="9">log collection</text>
</svg>
