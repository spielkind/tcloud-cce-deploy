<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <marker id="a1" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#4dabf7"/></marker>
    <marker id="a2" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#ffd43b"/></marker>
    <marker id="a3" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="5" orient="auto"><path d="M0,0 L10,3 L0,6" fill="#51cf66"/></marker>
  </defs>

  <rect width="800" height="360" fill="url(#bg)" rx="12"/>
  <text x="400" y="30" fill="#e9ecef" font-size="18" font-weight="700" text-anchor="middle">Workload Identity (OIDC) Flow</text>

  <!-- CCE Cluster box — tall, spans all 3 rows on the left -->
  <rect x="40" y="50" width="310" height="260" rx="8" fill="none" stroke="#2a4a6b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="195" y="67" fill="#868e96" font-size="10" text-anchor="middle">CCE Cluster</text>

  <!-- kubelet -->
  <rect x="60" y="85" width="100" height="50" rx="6" fill="#364fc7" opacity="0.9"/>
  <text x="110" y="106" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">kubelet</text>
  <text x="110" y="123" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">signs JWT</text>

  <!-- Pod — large box spanning rows -->
  <rect x="220" y="85" width="110" height="210" rx="6" fill="#228be6" opacity="0.9"/>
  <text x="275" y="110" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Pod</text>
  <text x="275" y="128" fill="#fff" font-size="9" text-anchor="middle">openbao / openbao</text>
  <text x="275" y="148" fill="#fff" font-size="8" text-anchor="middle" opacity="0.6">/var/run/secrets/</text>
  <text x="275" y="160" fill="#fff" font-size="8" text-anchor="middle" opacity="0.6">tokens/oidc-token</text>

  <!-- Step 1: kubelet → Pod -->
  <line x1="160" y1="110" x2="215" y2="110" stroke="#4dabf7" stroke-width="2" marker-end="url(#a1)"/>
  <circle cx="188" cy="95" r="10" fill="#e9ecef"/>
  <text x="188" y="99" fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">1</text>
  <text x="188" y="83" fill="#4dabf7" font-size="9" text-anchor="middle">OIDC token</text>

  <!-- Identity Provider (top right) -->
  <rect x="600" y="55" width="160" height="45" rx="6" fill="#7048e8" opacity="0.85"/>
  <text x="680" y="75" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Identity Provider</text>
  <text x="680" y="90" fill="#fff" font-size="9" text-anchor="middle" opacity="0.8">OIDC + JWKS key</text>

  <!-- IAM -->
  <rect x="560" y="135" width="200" height="70" rx="8" fill="#fab005" opacity="0.9"/>
  <text x="660" y="158" fill="#1a1a2e" font-size="14" font-weight="700" text-anchor="middle">IAM</text>
  <text x="660" y="175" fill="#1a1a2e" font-size="10" text-anchor="middle">validates JWT · maps sub → group</text>
  <text x="660" y="191" fill="#1a1a2e" font-size="10" text-anchor="middle" opacity="0.7">returns X-Subject-Token</text>

  <!-- IdP → IAM -->
  <line x1="680" y1="100" x2="680" y2="135" stroke="#7048e8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Step 2: Pod → IAM -->
  <line x1="330" y1="195" x2="555" y2="195" stroke="#ffd43b" stroke-width="2" marker-end="url(#a2)" stroke-dasharray="6,3"/>
  <text x="440" y="188" fill="#ffd43b" font-size="9" text-anchor="middle">POST id-token/tokens + JWT</text>

  <!-- IAM → Pod (return) -->
  <line x1="555" y1="155" x2="330" y2="155" stroke="#ffd43b" stroke-width="1.5" marker-end="url(#a2)" stroke-dasharray="6,3" opacity="0.5"/>
  <text x="440" y="150" fill="#ffd43b" font-size="9" text-anchor="middle" opacity="0.7">← X-Subject-Token</text>

  <circle cx="440" cy="213" r="10" fill="#e9ecef"/>
  <text x="440" y="217" fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">2</text>

  <!-- OTC API -->
  <rect x="560" y="245" width="200" height="60" rx="8" fill="#40c057" opacity="0.9"/>
  <text x="660" y="270" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">OTC API</text>
  <text x="660" y="287" fill="#fff" font-size="10" text-anchor="middle">FG · SMN · OBS · KMS …</text>

  <!-- Step 3: Pod → OTC API -->
  <line x1="330" y1="270" x2="555" y2="270" stroke="#51cf66" stroke-width="2" marker-end="url(#a3)" stroke-dasharray="6,3"/>
  <text x="440" y="263" fill="#51cf66" font-size="9" text-anchor="middle">X-Auth-Token: $IAM_TOKEN</text>

  <circle cx="440" cy="290" r="10" fill="#e9ecef"/>
  <text x="440" y="294" fill="#1a1a2e" font-size="10" font-weight="700" text-anchor="middle">3</text>

  <!-- Legend -->
  <rect x="40" y="322" width="390" height="28" rx="5" fill="#0d1b2a" stroke="#2a4a6b" stroke-width="1"/>
  <text x="55" y="340" fill="#868e96" font-size="9">No AK/SK · No secrets · Auto-rotating tokens · Least privilege · T-Cloud IRSA equivalent</text>
</svg>
