<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6fa5"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#2ecc71"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f1c40f"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3498db"/></marker>
    <marker id="a5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e74c3c"/></marker>
  </defs>

  <rect width="800" height="520" fill="url(#bg)" rx="12"/>

  <text x="400" y="35" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Demo App — SWR + Vault Integration</text>

  <!-- Row 1: External -->
  <rect x="40" y="60" width="160" height="50" rx="8" fill="url(#card)" stroke="#4a6fa5" stroke-width="1"/>
  <text x="120" y="82" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="600">⚙️ GitHub Actions</text>
  <text x="120" y="97" text-anchor="middle" fill="#889" font-size="9">build + push</text>

  <rect x="320" y="60" width="160" height="50" rx="8" fill="url(#card)" stroke="#3498db" stroke-width="1"/>
  <text x="400" y="82" text-anchor="middle" fill="#3498db" font-size="11" font-weight="600">📦 SWR</text>
  <text x="400" y="97" text-anchor="middle" fill="#889" font-size="9">Container Registry</text>

  <rect x="600" y="60" width="160" height="50" rx="8" fill="#2d3a5a" stroke="#4a6fa5" stroke-width="1"/>
  <text x="680" y="90" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">🌐 Browser</text>

  <!-- GH → SWR -->
  <line x1="200" y1="85" x2="318" y2="85" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Browser → Ingress -->
  <line x1="680" y1="110" x2="680" y2="158" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- CCE Cluster -->
  <rect x="30" y="140" width="740" height="340" rx="10" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="50" y="162" fill="#3498db" font-size="11" font-weight="700">CCE Cluster</text>

  <!-- Ingress -->
  <rect x="530" y="160" width="220" height="32" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="640" y="181" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">nginx-ingress + TLS</text>

  <!-- Ingress → Flask -->
  <path d="M530,182 L200,182 L200,248" fill="none" stroke="#2ecc71" stroke-width="1.5" marker-end="url(#a2)" stroke-linejoin="round"/>

  <!-- Demo App Pod (LEFT side) -->
  <rect x="50" y="250" width="310" height="120" rx="8" fill="none" stroke="#2ecc71" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="70" y="270" fill="#2ecc71" font-size="10" font-weight="700">pod: demo-app</text>

  <!-- Flask -->
  <rect x="70" y="282" width="125" height="70" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="132" y="310" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="600">🐍 Flask</text>
  <text x="132" y="328" text-anchor="middle" fill="#889" font-size="9">read: file</text>
  <text x="132" y="342" text-anchor="middle" fill="#889" font-size="9">write: API</text>

  <!-- Vault Agent -->
  <rect x="218" y="282" width="125" height="70" rx="6" fill="url(#card)" stroke="#f1c40f" stroke-width="1"/>
  <text x="280" y="310" text-anchor="middle" fill="#f1c40f" font-size="12" font-weight="600">🔑 Vault Agent</text>
  <text x="280" y="328" text-anchor="middle" fill="#889" font-size="9">sidecar</text>
  <text x="280" y="342" text-anchor="middle" fill="#889" font-size="9">→ /vault/secrets/</text>

  <!-- Vault HA (RIGHT side) -->
  <rect x="540" y="280" width="200" height="80" rx="8" fill="url(#card)" stroke="#f1c40f" stroke-width="1"/>
  <text x="640" y="308" text-anchor="middle" fill="#f1c40f" font-size="14" font-weight="700">🔐 Vault HA</text>
  <text x="640" y="328" text-anchor="middle" fill="#889" font-size="10">kv/demo/config</text>
  <text x="640" y="344" text-anchor="middle" fill="#889" font-size="9">K8s auth + userpass</text>

  <!-- SWR → Pod (image pull) -->
  <path d="M400,110 L400,210 L115,210 L115,248" fill="none" stroke="#3498db" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#a4)"/>
  <text x="260" y="225" fill="#3498db" font-size="9">image pull</text>

  <!-- Vault Agent → Vault (READ: fetch secrets, solid) -->
  <line x1="343" y1="305" x2="538" y2="305" stroke="#f1c40f" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="430" y="298" fill="#f1c40f" font-size="9">read secrets</text>

  <!-- Flask → Vault (WRITE: API, dashed red, routed below) -->
  <path d="M132,352 L132,420 L640,420 L640,362" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a5)" stroke-linejoin="round"/>
  <text x="380" y="438" fill="#e74c3c" font-size="9">write via API</text>

  <!-- Legend -->
  <line x1="50" y1="490" x2="80" y2="490" stroke="#f1c40f" stroke-width="1.5"/>
  <text x="85" y="494" fill="#889" font-size="9">Read (Injector → file)</text>
  <line x1="230" y1="490" x2="260" y2="490" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="265" y="494" fill="#889" font-size="9">Write (Flask → Vault API)</text>
  <line x1="440" y1="490" x2="470" y2="490" stroke="#3498db" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="475" y="494" fill="#889" font-size="9">Image pull (SWR)</text>
</svg>
