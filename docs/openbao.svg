<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a4a"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a6fa5"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#9b59b6"/></marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">OpenBao on CCE</text>
  <text x="400" y="50" text-anchor="middle" fill="#889" font-size="9">Helm chart openbao 0.30.8 · OpenBao v2.7.3 · HA Raft</text>

  <!-- Internet -->
  <rect x="320" y="56" width="160" height="36" rx="8" fill="#2d3a5a" stroke="#4a6fa5" stroke-width="1"/>
  <text x="400" y="79" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="600">🌐 User / CLI</text>

  <line x1="400" y1="92" x2="400" y2="120" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CCE Cluster -->
  <rect x="40" y="120" width="720" height="310" rx="10" fill="none" stroke="#3498db" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="142" fill="#3498db" font-size="11" font-weight="700">CCE Cluster</text>

  <!-- Ingress -->
  <rect x="300" y="135" width="200" height="30" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="400" y="155" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">nginx-ingress + Let's Encrypt</text>

  <line x1="400" y1="165" x2="400" y2="192" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OpenBao namespace -->
  <rect x="60" y="192" width="680" height="160" rx="8" fill="none" stroke="#f1c40f" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="80" y="210" fill="#f1c40f" font-size="10" font-weight="700">namespace: openbao</text>
  <text x="720" y="210" text-anchor="end" fill="#889" font-size="8">svc: openbao · openbao-internal · openbao-active</text>

  <!-- OpenBao pods -->
  <rect x="80" y="222" width="170" height="65" rx="6" fill="url(#card)" stroke="#f39c12" stroke-width="1"/>
  <text x="165" y="244" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="700">openbao-0</text>
  <text x="165" y="258" text-anchor="middle" fill="#e0e0e0" font-size="9">⭐ Leader</text>
  <text x="165" y="275" text-anchor="middle" fill="#889" font-size="8">Raft · EVS 10Gi · /openbao/data</text>

  <rect x="315" y="222" width="170" height="65" rx="6" fill="url(#card)" stroke="#f39c12" stroke-width="1"/>
  <text x="400" y="244" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="700">openbao-1</text>
  <text x="400" y="258" text-anchor="middle" fill="#e0e0e0" font-size="9">Follower</text>
  <text x="400" y="275" text-anchor="middle" fill="#889" font-size="8">Raft · EVS 10Gi · /openbao/data</text>

  <rect x="550" y="222" width="170" height="65" rx="6" fill="url(#card)" stroke="#f39c12" stroke-width="1"/>
  <text x="635" y="244" text-anchor="middle" fill="#f39c12" font-size="12" font-weight="700">openbao-2</text>
  <text x="635" y="258" text-anchor="middle" fill="#e0e0e0" font-size="9">Follower</text>
  <text x="635" y="275" text-anchor="middle" fill="#889" font-size="8">Raft · EVS 10Gi · /openbao/data</text>

  <!-- Raft arrows -->
  <line x1="250" y1="254" x2="315" y2="254" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="485" y1="254" x2="550" y2="254" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="282" y="248" text-anchor="middle" fill="#f39c12" font-size="7">Raft</text>
  <text x="517" y="248" text-anchor="middle" fill="#f39c12" font-size="7">Raft</text>

  <!-- Injector -->
  <rect x="80" y="305" width="200" height="36" rx="6" fill="url(#card)" stroke="#9b59b6" stroke-width="1"/>
  <text x="180" y="328" text-anchor="middle" fill="#9b59b6" font-size="11" font-weight="600">🔌 openbao-agent-injector</text>

  <!-- App pods -->
  <rect x="350" y="305" width="370" height="36" rx="6" fill="url(#card)" stroke="#2ecc71" stroke-width="1"/>
  <text x="535" y="328" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">📦 App Pods → /vault/secrets/config</text>

  <line x1="280" y1="323" x2="350" y2="323" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Setup flow -->
  <rect x="80" y="370" width="640" height="46" rx="6" fill="#141c30"/>
  <text x="100" y="388" fill="#aaa" font-size="9" font-weight="600">Setup (one-time):</text>
  <text x="100" y="406" fill="#889" font-size="9">tofu apply → openbao-init.sh → upload unseal keys to OBS (KMS-encrypted) → auto-unseal via Init Container + FunctionGraph</text>

  <!-- Footer -->
  <text x="400" y="470" text-anchor="middle" fill="#556" font-size="9">Unseal keys KMS-encrypted in OBS · Root token revoked after setup · Auto-unseal via FunctionGraph on pod restart</text>
  <text x="400" y="486" text-anchor="middle" fill="#445" font-size="8">See docs/openbao-unseal.md for auto-unseal architecture</text>
</svg>
