apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        # The OpenBao chart ships the vault-k8s injector, which only reads vault.hashicorp.com/* keys.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.baoRole | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.secretPath | quote }}
        vault.hashicorp.com/template-static-secret-render-interval: "30s"
        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret `}}"{{ .Values.secretPath }}"{{` -}}`}}
          {{`{{- range $k, $v := .Data.data }}`}}
          {{`{{ $k }}={{ $v }}`}}
          {{`{{ end }}`}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: demo-app
      imagePullSecrets:
        - name: default-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: {{ .Values.image | quote }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: BAO_ADDR
              value: {{ .Values.baoAddr | quote }}
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
      volumes:
        - name: tmp
          emptyDir: {}
