apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vaultRole | quote }}
        vault.hashicorp.com/agent-inject-secret-config: {{ .Values.vaultSecretPath | quote }}
        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret `}}"{{ .Values.vaultSecretPath }}"{{` -}}`}}
          {{`message={{ .Data.data.message }}`}}
          {{`api_key={{ .Data.data.api_key }}`}}
          {{`{{- end }}`}}
    spec:
      serviceAccountName: demo-app
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: demo-app
          image: {{ .Values.image | quote }}
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
