image: ""
hostname: ""
replicas: 1
# One model per tab; loaded on first use, least recently used unloaded when VRAM is short.
models:
  image: "stabilityai/sdxl-turbo"
  chat: "Qwen/Qwen2.5-3B-Instruct"
  stt: "openai/whisper-large-v3-turbo"
  vision: "florence-community/Florence-2-base"
preload: "image"
# Optional: Hugging Face token injected by the OpenBao agent (no token in values or state).
openbao:
  enabled: false
  role: "gpu-demo"
  secretPath: "kv/data/gpu-demo/hf"
imageSize: 512
storage:
  size: 60Gi
  storageClass: csi-disk-topology
nodeSelector:
  accelerator: nvidia
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
# CPU/RAM only; the GPU (whole card or xGPU slice) is added by the templates.
resources:
  requests:
    cpu: "2"
    memory: 12Gi
  limits:
    cpu: "6"
    memory: 28Gi
# GPU slicing (CCE xGPU + Volcano): playground and workers share one GPU with hard
# VRAM (memGib, multiple of 0.125) and compute (corePercent) limits.
slicing:
  enabled: false
  playground:
    memGib: 13
    corePercent: 50
  workers:
    - name: small
      memGib: 2
      corePercent: 10
    - name: medium
      memGib: 3
      corePercent: 15
    - name: large
      memGib: 4
      corePercent: 25
  workerResources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 4Gi
